  <!-- Brand Typography (Light / Ivory Variation matching Light logo H.png) -->
  <!-- Main Title: Shri Vani Jagat in warm luxury ivory -->
  <text x="145" y="72" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" font-weight="700" fill="#F4EEDF" letter-spacing="-0.5">
    Shri Vani Jagat
  </text>
  
  <!-- Subtitle Tagline: CAPTURE • CREATE • LIVE -->
  <text x="148" y="102" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#D4AF37" letter-spacing="4.5">
    CAPTURE &bull; CREATE &bull; LIVE
  </text>
</svg>
