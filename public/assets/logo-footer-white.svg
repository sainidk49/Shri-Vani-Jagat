      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(345 60 60)" fill="#0E7870" />
    </g>

    <!-- Inner Circle Background -->
    <circle cx="60" cy="60" r="45" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2" />
    
    <!-- Dotted Gold Ring -->
    <circle cx="60" cy="60" r="41" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="2,3" fill="none" opacity="0.9" />

    <!-- Center Composition: Peacock Feather (Mor Pankh) & Veena forming 'V' -->
    <!-- Peacock Feather (Left branch) -->
    <g transform="translate(26, 26)">
      <path d="M 32 64 Q 28 35 15 15" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M 15 15 C 8 8, 2 20, 10 26 C 2 30, 8 40, 18 36 C 12 42, 18 50, 26 46" fill="#028090" opacity="0.9" />
      <path d="M 15 15 C 22 10, 28 20, 22 28 C 30 30, 26 42, 22 46 C 26 50, 22 56, 18 58" fill="#00A896" opacity="0.85" />
      <ellipse cx="16" cy="22" rx="7" ry="10" transform="rotate(-25 16 22)" fill="#05668D" />
      <ellipse cx="16" cy="22" rx="5" ry="7" transform="rotate(-25 16 22)" fill="#D4AF37" />
      <ellipse cx="16" cy="22" rx="2.5" ry="4" transform="rotate(-25 16 22)" fill="#023047" />
      <circle cx="16" cy="21" r="1.5" fill="#F4E4A6" />
    </g>

    <!-- Veena (Right branch) -->
    <g transform="translate(42, 30)">
      <path d="M 16 58 L 36 14" stroke="#8D5B4C" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 17 57 L 35 15" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" />
      <line x1="20" y1="50" x2="23" y2="48" stroke="#D4AF37" stroke-width="1.5" />
      <line x1="23" y1="44" x2="26" y2="42" stroke="#D4AF37" stroke-width="1.5" />
      <line x1="26" y1="38" x2="29" y2="36" stroke="#D4AF37" stroke-width="1.5" />
      <line x1="29" y1="32" x2="32" y2="30" stroke="#D4AF37" stroke-width="1.5" />
      <line x1="32" y1="26" x2="35" y2="24" stroke="#D4AF37" stroke-width="1.5" />
      <circle cx="14" cy="62" r="7" fill="#6A382C" stroke="#D4AF37" stroke-width="1.2" />
      <path d="M 36 14 Q 42 10 41 6 Q 37 4 34 8" fill="#753F32" stroke="#D4AF37" stroke-width="1" />
      <circle cx="38" cy="11" r="1.8" fill="#D4AF37" />
      <circle cx="34" cy="17" r="1.8" fill="#D4AF37" />
