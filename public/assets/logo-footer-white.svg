      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(120 60 60)" fill="#0C6860" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(135 60 60)" fill="#0E7870" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(150 60 60)" fill="#0C6860" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(165 60 60)" fill="#0E7870" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(180 60 60)" fill="#0C6860" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(195 60 60)" fill="#0E7870" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(210 60 60)" fill="#0C6860" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(225 60 60)" fill="#0E7870" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(240 60 60)" fill="#0C6860" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(255 60 60)" fill="#0E7870" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(270 60 60)" fill="#0C6860" />
