      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(0 60 60)" fill="#0C6860" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(15 60 60)" fill="#0E7870" />
      <path d="M 60 4 A 8 8 0 0 1 68 12 A 8 8 0 0 1 60 20 A 8 8 0 0 1 52 12 Z" transform="rotate(30 60 60)" fill="#0C6860" />
